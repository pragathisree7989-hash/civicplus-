<script>
const $=s=>document.querySelector(s),sleep=ms=>new Promise(r=>setTimeout(r,ms)),DAY=864e5;

const B={a:13.615,b:13.64,c:79.405,d:79.435},px=(la,ln)=>[(ln-B.c)/(B.d-B.c)*400,(B.b-la)/(B.b-B.a)*300],unpx=(x,y)=>[B.b-y/300*(B.b-B.a),B.c+x/400*(B.d-B.c)];

let S,V='home',H='near',R=null,M=null,RL=[],F={c:'',s:'',p:'',w:''},showAll=0,drag=0;
function seed(){const now=Date.now();let k=7;const rnd=()=>(k=(k*16807)%2147483647)/2147483647;
const U=[['u1','Kutty','citizen',50,'Korlagunta'],['u2','Lakshmi Devi','citizen',80,'Tilak Road'],['u3','Ravi Teja','citizen',65,'Leelamahal'],['u4','Suresh Babu','citizen',72,'Air Bypass'],['u5','Anitha Reddy','citizen',58,'Alipiri Road'],['u6','Unknown 9981','citizen',18,'Leelamahal'],['a1','Commissioner Rao','authority',90,'All wards']].map(a=>({id:a[0],name:a[1],role:a[2],trust_score:a[3],ward:a[4]}));

seq.forEach((s,j)=>st.log.push({id:'l'+st.log.length,issue_id:id,status:s,changed_by:j?'a1':o.u,note:j==0?'Report submitted':s=='Assigned'?'Assigned to '+TEAM[o.c]:s=='Rejected'?'Rejected — insufficient evidence':s=='Verified'?'Verified by authority':s=='Resolved'?'Resolved & closed':'Work started',timestamp:cr+(now-cr)*j/seq.length*.9}))};
mk({c:'water',d:'Open manhole without cover right outside Govt. High School gate — children at risk',s:'Critical',la:13.6263,ln:79.4151,days:3,conf:12,st:'Verified',u:'u2',w:'Korlagunta'});
mk({c:'road',d:'Deep pothole at bus stand entrance, two-wheelers skidding',s:'High',la:13.62905,ln:79.41925,days:2,conf:4,st:'New',u:'u3',w:'Korlagunta'});
mk({c:'drain',d:'Blocked drain overflowing near Area Hospital emergency gate',s:'High',la:13.631,ln:79.423,days:6,conf:18,st:'Assigned',u:'u4',w:'Tilak Road',m:6});
mk({c:'water',d:'Brown, foul-smelling tap water supplied since morning — contamination suspected',s:'High',la:13.6235,ln:79.4175,days:2,conf:9,st:'Verified',u:'u5',w:'Leelamahal'});
mk({c:'road',d:'Small pothole in side lane, slow traffic only',s:'Low',la:13.62,ln:79.43,days:1,conf:0,st:'New',u:'u3',w:'Air Bypass'});
mk({c:'light',d:'Streetlight not working on Tilak Road stretch',s:'Medium',la:13.625,ln:79.4268,days:5,conf:3,st:'New',u:'u2',w:'Tilak Road'});
mk({c:'road',d:'Pothole bigger than a house!!! URGENT!!!',s:'Critical',la:13.618,ln:79.433,days:1,conf:0,st:'New',u:'u6',flag:'Location mismatch — GPS 4.2 km from pin',w:'Air Bypass'});
[[13.633,79.412,6],[13.6332,79.4123,2],[13.6329,79.4119,1],[13.6334,79.4126,0],[13.633,79.4116,1]].forEach((g,j)=>mk({c:'garbage',d:['Garbage heap not collected for a week','Overflowing dustbin near market','Waste dumped on roadside','Stray animals scattering garbage','Foul smell from uncollected waste'][j],s:j?'Medium':'High',la:g[0],ln:g[1],days:7-j,conf:g[2],st:j<4?'New':'Verified',u:['u3','u4','u5','u2','u1'][j],w:'Leelamahal',m:j?0:3}));
mk({c:'drain',d:'Drain choked with plastic near temple street',s:'Medium',la:13.6315,ln:79.4228,days:4,conf:5,st:'New',u:'u5',w:'Tilak Road'});
mk({c:'drain',d:'Drain water entering houses',s:'High',la:13.6309,ln:79.4233,days:5,conf:7,st:'In Progress',u:'u3',w:'Tilak Road'});
mk({c:'garbage',d:'Garbage near colony entrance cleared',s:'Medium',la:13.627,ln:79.418,days:9,conf:2,st:'Resolved',u:'u1',w:'Korlagunta'});
mk({c:'light',d:'Streetlight flickering at park corner',s:'Medium',la:13.6275,ln:79.4205,days:5,conf:2,st:'In Progress',u:'u1',w:'Korlagunta'});
const D={road:['Pothole on service road','Broken road edge','Road cave-in after rain'],water:['Pipe leakage wasting water','Low pressure, dirty water'],drain:['Drain blocked with silt','Open drain without slab'],garbage:['Garbage dumped at empty plot','Dustbin overflow'],light:['Streetlight off for 3 nights','Dark lane, light missing'],other:['Stray dog menace','Encroachment on footpath']},ks=Object.keys(D),sv=['Low','Medium','Medium','High','Critical'],ss=['New','New','New','Verified','Assigned','In Progress','Resolved','Resolved','Rejected'];
for(let n=0;n<26;n++){const c=ks[Math.floor(rnd()*6)],a=D[c];mk({c,d:a[Math.floor(rnd()*a.length)],s:sv[Math.floor(rnd()*5)],la:B.a+.003+rnd()*.019,ln:B.c+.003+rnd()*.024,days:Math.floor(rnd()*13)+1,conf:Math.floor(rnd()*7),st:ss[Math.floor(rnd()*9)],u:U[1+Math.floor(rnd()*4)].id,w:WARDS[Math.floor(rnd()*5)]})}
st.notes.push({id:'n1',to:'u1',text:'Your streetlight report is now In Progress.',t:now-DAY,read:0},{id:'n2',to:'u1',text:'Your garbage report has been resolved.',t:now-3*DAY,read:1});return st}
const save=()=>{try{localStorage.setItem('cp1',JSON.stringify(S))}catch(e){}};
try{S=JSON.parse(localStorage.getItem('cp1')||'null')}catch(e){}S=S||seed();
const cnt=i=>i.base+S.conf.filter(c=>c.issue_id==i.id).length,open=i=>i.status!='Resolved'&&i.status!='Rejected',U=id=>S.users.find(u=>u.id==id)||{name:'?',trust_score:50};
const lv=t=>t>=70?['Critical','er']:t>=55?['High','wa']:t>=40?['Medium','pr']:['Low','ok'];
function sc(i){const c=cnt(i),d=(Date.now()-i.created_at)/DAY;let L=0,Ln='No sensitive place within 150 m';LM.forEach(m=>{if(dist(i.latitude,i.longitude,m.la,m.ln)<=150&&m.s>L){L=m.s;Ln='Near '+m.t+' ('+m.n+')'}});
const P=[['Severity',SEV[i.severity],.3,i.severity],['Category Risk',CATS[i.category][2],.25,CATS[i.category][0]+(i.category=='water'?' (open manhole / contamination)':'')],['Community Confirmations',Math.min(100,c*5),.2,c+' confirmations × 5, capped at 100'],['Age',Math.min(100,Math.round(d*10)),.1,d.toFixed(1)+' days unresolved (+10 per day)'],['Location Sensitivity',L,.1,Ln],['Reporter Trust',U(i.reporter_id).trust_score,.05,U(i.reporter_id).name]];
i.priority_score=Math.round(P.reduce((a,p)=>a+p[1]*p[2],0)*100)/100;return{P,t:i.priority_score}}
const ranked=()=>S.issues.filter(open).sort((a,b)=>sc(b).t-sc(a).t);

function toast(m,k){const t=$('#t');t.textContent=m;t.style.display='block';t.style.background=k=='er'?'var(--er)':'';t.style.color=k=='er'?'#fff':'';clearTimeout(t.h);t.h=setTimeout(()=>t.style.display='none',3200)}
const note=(to,text)=>S.notes.unshift({id:'n'+Date.now()+Math.random(),to,text,t:Date.now(),read:0});
function brk(i){const r=sc(i),k=ranked().findIndex(x=>x.id==i.id)+1;return `<div>`+r.P.map(p=>`<div class=br><div class=bl><b>${p[0]}</b><span>${p[1]} × ${Math.round(p[2]*100)}% = ${(p[1]*p[2]).toFixed(2)}</span></div><div class=bar><i style="width:${p[1]}%"></i></div><small>${esc(p[3])}</small></div>`).join('')+`<div class=tot>TOTAL PRIORITY: ${r.t.toFixed(2)}</div><p>${k?'<b>Priority #'+k+'</b> of '+ranked().length+' open issues — ':''}<span class="pill ${lv(r.t)[1]}">${lv(r.t)[0]}</span></p><small>Formula: 0.30·Severity + 0.25·Category + 0.20·Confirmations + 0.10·Age + 0.10·Location + 0.05·Trust</small></div>`}
